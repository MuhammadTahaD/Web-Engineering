<!DOCTYPE html>
<html>

<head>
    <title>Table</title>
    <style>
        table {
            width: 50%;
            margin: 0px auto;
            border: 1px solid gray;
            background-color: lightgoldenrodyellow;
        }

        th {
            border-right: 1px solid gray;
            background-color: gray;
        }

        td {
            border-right: 1px solid gray;
            border-bottom: 1px solid gray;
        }

        header {
            text-align: center;
            background-color: lightgray;
            height: 20%;
            border: 2px solid gray;

        }

        main {
            height: 70%;
            width: 70%;
            border: 2px solid green;
            float: left;
            margin: 2px;
            background-color: lightcyan;
        }

        aside {
            width: 28%;
            border: 2px solid rgb(128, 0, 32);
            float: left;
            background-color: lightyellow;
        }

        footer {
            background-color: lightgray;
            height: 20%;
            border: 2px solid gray;
            clear: both;
        }

        li {
            list-style-type: circle;
        }

        nav ul {}

        nav ul li {
            color: green;
            font-weight: bold;
            list-style: none;
            display: inline;
            padding: 40px;

        }
    </style>
</head>

            </ul>
        </nav>
    </header>
    <main>

    </main>
    <aside>

            <li>Item 1</li>
            <li>Item 2</li>

        </ul>
        <ol>
            <li>Item 1</li>
            <li>Item 2</li>

            <li>Item 4</li>
        </ol>
    </aside>
    <footer>
        Footer
    </footer>
</body>

</html>
