<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="calculator">
        <div class="header">
            <h2>Calculator</h2>
            <div class="menu-container">
                <button class="menu-btn" type="button">☰</button>
                <div class="submenu">
                    <button type="button">Standard</button>
                    <button type="button">Scientific</button>
                </div>
            </div>
        </div>

        <input id="display" type="text" readonly>

        <div class="buttons">
            <button class="clear" onclick="clearDisplay()" type="button">C</button>
            <button onclick="deleteLast()" type="button">⌫</button>
            <button onclick="appendNumber('.')" type="button">.</button>
            <button class="operator" onclick="setOperator('/')" type="button">÷</button>

            <button onclick="appendNumber('7')" type="button">7</button>
            <button onclick="appendNumber('8')" type="button">8</button>
            <button onclick="appendNumber('9')" type="button">9</button>
            <button class="operator" onclick="setOperator('*')" type="button">×</button>

            <button onclick="appendNumber('4')" type="button">4</button>
            <button onclick="appendNumber('5')" type="button">5</button>
            <button onclick="appendNumber('6')" type="button">6</button>
            <button class="operator" onclick="setOperator('-')" type="button">−</button>

            <button onclick="appendNumber('1')" type="button">1</button>
            <button onclick="appendNumber('2')" type="button">2</button>
            <button onclick="appendNumber('3')" type="button">3</button>
            <button class="operator" onclick="setOperator('+')" type="button">+</button>

            <button onclick="appendNumber('0')" type="button">0</button>
            <button onclick="appendNumber('00')" type="button">00</button>
            <button class="equal" onclick="calculate()" type="button">=</button>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
